{{ define "content" }}
<main class="photos-wrap">
  <h1 class="photos-title">{{ .Title }}</h1>

  <section class="photos-grid">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ $base := .File.ContentBaseName }}
      {{ $thumb := printf "/images/drawing/%s.jpg" $base }}

      <a class="ph-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
        <img src="{{ $thumb }}" alt="{{ .Title }}" loading="lazy" decoding="async">
      </a>
    {{ end }}
  </section>
</main>
{{ end }}
