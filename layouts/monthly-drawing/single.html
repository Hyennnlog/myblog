{{ define "content" }}
<main class="md-wrap">

  <h1 class="monthly-title">{{ .Title }}</h1>

  {{ with .Content }}
    <div style="margin:0 0 18px 0; font-size:14px; line-height:1.7;">
      {{ . }}
    </div>
  {{ end }}

  <section class="md-grid md-grid--inside">
      {{ range where (.Resources.ByType "image") "Name" "ne" "main.jpg" }}
      {{ $img := . }}
      {{ $thumb := $img.Fill "900x900 Center" }}
      <a class="md-card" href="{{ $img.RelPermalink }}" aria-label="{{ $img.Name }}">
        <img src="{{ $thumb.RelPermalink }}" alt="{{ $img.Name }}" loading="lazy" decoding="async">
      </a>
    {{ end }}
  </section>

</main>
{{ end }}
