{{ define "content" }}
<main class="photos-single container">
  <article>
    <h1 class="photos-title">{{ .Title }}</h1>

    {{ $base := .File.ContentBaseName }}
    {{ $img := printf "/images/drawing/%s.jpg" $base }}

    <figure class="ph-figure">
      <img src="{{ $img }}" alt="{{ .Title }}" style="max-width:100%;height:auto;display:block;">
    </figure>

    <div class="photos-single-body">
      {{ .Content }}
    </div>
  </article>
</main>
{{ end }}
