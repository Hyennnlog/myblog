{{ define "content" }}
<main class="md-wrap">

  <h1 class="monthly-title">{{ .Title }}</h1>

  <section class="md-grid">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ $img := or (.Resources.GetMatch "main.*") (index (.Resources.ByType "image") 0) }}
      {{ if $img }}
        {{ $thumb := $img.Fill "600x600 Center" }}
        <a class="md-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
          <img src="{{ $thumb.RelPermalink }}" alt="{{ .Title }}" loading="lazy" decoding="async">
          <span class="md-label">{{ .Title }}</span>
        </a>
      {{ end }}
    {{ end }}
  </section>

</main>
{{ end }}
