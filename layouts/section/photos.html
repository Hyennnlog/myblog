{{ define "content" }}
<main class="film-wrap">

  <h1 class="film-title">{{ .Title }}</h1>

  <section class="film-grid">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ $cover := or (.Resources.GetMatch "main.*") (index (.Resources.ByType "image") 0) }}
      {{ if $cover }}
        {{ $thumb := $cover.Fill "900x900 Center" }}
        <a class="film-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
          <img src="{{ $thumb.RelPermalink }}" alt="{{ .Title }}" loading="lazy" decoding="async">
          <span class="film-label">{{ .Title }}</span>
        </a>
      {{ end }}
    {{ end }}
  </section>

</main>
{{ end }}
