{{ define "content" }}
<main class="photos-wrap">
  <h1 class="photos-title">{{ .Title }}</h1>

  <section class="photos-grid">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ $img := or (.Resources.GetMatch "main.*") (index (.Resources.ByType "image") 0) }}
      {{ if $img }}
        {{ $thumb := $img.Resize "900x"  }}  <!-- ✨ 여기만 수정 -->
        <a class="ph-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
          <img src="{{ $thumb.RelPermalink }}" alt="{{ .Title }}" loading="lazy" decoding="async">
        </a>
      {{ end }}
    {{ end }}
  </section>
</main>
<style>
  /* 전체 컨테이너 */
  .photos-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* 제목 */
  .photos-title {
    color: #3d61ad;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-align: left;
    text-indent: 1.2em;
    margin:40px 0 28px;
  }

  /* 그리드 기본: 데스크탑 3칸 */
  .photos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }

  /* 카드 (비율은 여기에서) */
  .ph-card {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;   /* 👈 가로가 긴 비율 (원하면 16/9, 4/3도 가능) */
    overflow: hidden;
  }

  /* 카드 안 이미지 */
  .ph-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 0;
  }

  /* 모바일(600px 이하)에서 3칸 */
  @media (max-width: 600px) {
    .photos-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
    }
  }
</style>
{{ end }}
