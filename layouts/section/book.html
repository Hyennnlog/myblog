{{ define "content" }}
<main class="photos-wrap">

  <!-- ✅ 반투명 박스용 래퍼 -->
  <div class="book-panel">
    <h1 class="photos-title">{{ .Title }}</h1>

    <section class="photos-grid">
      {{ range .RegularPages.ByDate.Reverse }}
        {{ $img := or (.Resources.GetMatch "main.*") (index (.Resources.ByType "image") 0) }}
        {{ if $img }}
          {{ $thumb := $img.Fill "600x600 Center" }}
          <a class="ph-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
            <img src="{{ $thumb.RelPermalink }}" alt="{{ .Title }}" loading="lazy" decoding="async">
          </a>
        {{ end }}
      {{ end }}
    </section>
  </div> <!-- /.book-panel -->

</main>

<style>
  /* 전체 컨테이너 */
  .photos-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* ✅ 반투명 박스 */
  .book-panel {
    background: rgba(0, 0, 0, 0.5);  /* ← 반투명 검정 */
    padding: 20px;
    border-radius: 10px;
  }

  /* 제목 */
  .photos-title {
    color: #fff;
    font-weight: 200;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-align: left;
    text-indent: 1.2em;
    margin: 0 0 20px;
  }

  /* 그리드 기본: 데스크탑 3칸 */
  .photos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  /* 카드 이미지 */
  .ph-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 1 / 1;
    display: block;
    border-radius: 0;
  }

  /* 모바일(600px 이하)에서 3칸 */
  @media (max-width: 600px) {
    .photos-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
</style>
{{ end }}
