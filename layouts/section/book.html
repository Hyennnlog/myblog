{{ define "content" }}
<main class="photos-wrap">
  <h1 class="photos-title">{{ .Title }}</h1>

  <section class="photos-grid">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ $img := or (.Resources.GetMatch "main.*") (index (.Resources.ByType "image") 0) }}
      {{ if $img }}
        {{ $thumb := $img.Fill "600x600 Center" }}
        <a class="ph-card" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
          <img src="{{ $thumb.RelPermalink }}" alt="{{ .Title }}" loading="lazy" decoding="async">
        </a>
      {{ end }}
    {{ end }}
  </section>
</main>

<style>
  /* 전체 컨테이너 */
  .photos-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* 제목 */
  .photos-title {
    color: #666;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 1.5px;
    text-align: left;
  }

  /* 그리드 기본: 데스크탑 3칸 */
  .photos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  /* 카드 이미지 */
  .ph-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 1 / 1;   /* 정사각형 */
    display: block;
    border-radius: 0;
  }

  /* 모바일(600px 이하)에서 3칸 */
  @media (max-width: 600px) {
    .photos-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
</style>
{{ end }}
